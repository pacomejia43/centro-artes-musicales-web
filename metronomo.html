<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Metrónomo – Centro de Artes Musicales</title>
  <link rel="stylesheet" href="css/estilos.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ════════════════════════════════════
       PÁGINA – fondo crema con decoración
    ════════════════════════════════════ */
    .metro-page {
      min-height: 100vh;
      background: #edeee4;                    /* crema verdoso igual a la imagen */
      background-image:
        radial-gradient(ellipse at 4% 78%, rgba(90,130,70,.13) 0%, transparent 48%),
        radial-gradient(ellipse at 94% 82%, rgba(90,130,70,.10) 0%, transparent 44%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Clave de sol decorativa fondo derecho */
    .metro-page::after {
      content: '𝄞';
      position: absolute;
      right: 3%;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24rem;
      color: rgba(90,120,70,.07);
      pointer-events: none;
      line-height: 1;
      user-select: none;
    }

    /* Hoja decorativa izquierda */
    .metro-page::before {
      content: '';
      position: absolute;
      left: 0; bottom: 10%;
      width: 180px; height: 300px;
      background: radial-gradient(ellipse at 20% 80%,
        rgba(90,130,70,.18) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Volver ─────────────────────────── */
    .metro-back-link {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 6px;
      color: #6a8a5a; font-size: .78rem; text-decoration: none;
      margin-bottom: 20px; transition: color .15s;
      font-weight: 600;
    }
    .metro-back-link:hover { color: #2d5a2d; }

    /* ── Encabezado ─────────────────────── */
    .metro-page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    /* Cambio 2: subtítulo ahora es el título grande */
    .metro-page-header .metro-main-title {
      font-size: 1.9rem; font-weight: 700; color: #1a3a1a;
      margin-bottom: 4px; letter-spacing: .01em;
    }
    /* Cambio 1: "Metrónomo" queda debajo, más pequeño */
    .metro-page-header .metro-sub-title {
      font-size: 1.8rem; font-weight: 600; color: #5a8a4a;
      font-style: italic; margin-top: 2px;
    }

    /* ── Cuerpo principal ───────────────── */
    .metro-body {
      width: 100%; max-width: 700px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ════════════════════════════════════
       DISPLAY – tarjeta blanca con sombra suave
    ════════════════════════════════════ */
    .metro-display {
      background: #ffffff;
      border: 1px solid #ddddd0;
      border-radius: 18px;
      padding: 22px 26px 18px;
      box-shadow: 0 2px 20px rgba(60,90,40,.09);
    }

    .metro-display-cols {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .metro-col {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; flex: 1;
    }
    .metro-col-label {
      font-size: .6rem; font-weight: 700; letter-spacing: .15em;
      text-transform: uppercase; color: #9aaa8a; margin-bottom: 2px;
    }
    .metro-col-value {
      font-size: 2.8rem; font-weight: 700; color: #1a3a1a; line-height: 1;
    }
    .metro-col-sub {
      font-size: .72rem; color: #6a8a5a; font-style: italic; margin-top: 3px;
    }
    .metro-col-divider {
      width: 1px; background: #e4e4d8; align-self: stretch; margin: 0 2px;
    }

    /* Botón ♩ subdivisión */
    .metro-subdiv-btn {
      background: none; border: none; cursor: pointer;
      font-size: 2.2rem; color: #2d5a2d; line-height: 1;
      transition: transform .15s, color .15s; padding: 0;
    }
    .metro-subdiv-btn:hover { transform: scale(1.12); color: #1a3a1a; }

    /* Toggle sonido */
    .metro-sound-toggle { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .toggle-switch {
      width: 46px; height: 24px; border-radius: 12px;
      background: #3a6a2a; border: none; cursor: pointer;
      position: relative; transition: background .2s;
    }
    .toggle-switch::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; transition: transform .2s;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .toggle-switch.on::after  { transform: translateX(22px); }
    .toggle-switch.off { background: #bbbba8; }
    .toggle-switch.off::after { transform: none; }
    .toggle-label { font-size: .6rem; color: #8a9a7a; text-align: center; }

    /* ── Barras de beat ──────────────────── */
    .metro-beats-display { display: flex; gap: 7px; margin-top: 16px; }
    .metro-beat-bar {
      flex: 1; height: 28px; border-radius: 6px;
      background: #e8e8d8;
      transition: background .06s, box-shadow .06s;
    }
    .metro-beat-bar.active-strong {
      background: #2d5a2d; box-shadow: 0 0 10px rgba(45,90,45,.35);
    }
    .metro-beat-bar.active-normal { background: #7aaa6a; }
    .metro-beat-bar.active-soft   { background: #b4ccaa; }

    /* ── Panel de acentos ────────────────── */
    .metro-accents-panel {
      display: none;
      background: #fff; border: 1px solid #ddddd0; border-radius: 12px;
      padding: 14px 16px; gap: 8px; flex-wrap: wrap; justify-content: center;
      box-shadow: 0 2px 12px rgba(60,90,40,.07);
    }
    .metro-accents-panel.visible { display: flex; }
    .metro-accents-panel p {
      width: 100%; font-size: .62rem; color: #9aaa8a;
      letter-spacing: .1em; text-transform: uppercase; text-align: center; margin-bottom: 4px;
    }
    .accent-beat-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: #f5f5ec; border: 1.5px solid #ccccc0;
      border-radius: 8px; padding: 8px 10px; cursor: pointer; min-width: 50px;
      transition: border-color .15s, background .15s;
      font-family: 'Montserrat', sans-serif;
    }
    .accent-beat-btn span.beat-num { font-size: .6rem; color: #9aaa8a; }
    .accent-beat-btn span.beat-icon { font-size: 1rem; color: #7aaa6a; transition: color .15s; }
    .accent-beat-btn[data-level="0"] { opacity: .5; }
    .accent-beat-btn[data-level="0"] .beat-icon { color: #b4b4a0; }
    .accent-beat-btn[data-level="1"] { border-color: #7aaa6a; }
    .accent-beat-btn[data-level="1"] .beat-icon { color: #7aaa6a; }
    .accent-beat-btn[data-level="2"] {
      border-color: #2d5a2d; background: #eaf0e4;
      box-shadow: 0 0 6px rgba(45,90,45,.14);
    }
    .accent-beat-btn[data-level="2"] .beat-icon { color: #2d5a2d; }

    /* ── Slider BPM ─────────────────────── */
    .metro-bpm-slider-row { display: flex; align-items: center; gap: 10px; }
    .metro-bpm-slider-row span {
      font-size: .7rem; color: #6a8a5a; min-width: 26px; font-weight: 600;
    }
    .metro-bpm-slider {
      -webkit-appearance: none; flex: 1; height: 5px; border-radius: 3px;
      outline: none; cursor: pointer;
      background: linear-gradient(to right,
        #3a6a2a 0%, #3a6a2a var(--fill,35%),
        #d0d0c0 var(--fill,35%), #d0d0c0 100%);
    }
    .metro-bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: #3a6a2a; border: 3px solid #fff;
      box-shadow: 0 1px 6px rgba(45,90,45,.35); cursor: pointer;
    }
    .metro-bpm-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: #3a6a2a; border: 3px solid #fff; cursor: pointer;
    }

    /* ── Dial + flechas ─────────────────── */
    .metro-dial-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 8px 0;
    }

    /* Botones de flecha */
    .metro-arrow-btn {
      background: #fff; border: 1.5px solid #ccccc0;
      border-radius: 10px; color: #4a7a3a; height: 44px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 3px; transition: background .15s, border-color .15s, color .15s;
      flex-shrink: 0; font-family: 'Montserrat', sans-serif; font-weight: 700;
      box-shadow: 0 1px 4px rgba(60,90,40,.08);
    }
    .metro-arrow-btn:hover { background: #eaf0e4; border-color: #3a6a2a; color: #1a3a1a; }
    .metro-arrow-btn:active { transform: scale(.93); }

    /* ±1: solo ícono, cuadrado */
    .metro-arrow-btn.step1 { width: 44px; font-size: 1rem; }

    /* ±5: ícono + texto, con borde verde */
    .metro-arrow-btn.step5 {
      width: 56px; flex-direction: column; gap: 1px; padding: 6px 8px;
      border-color: #3a6a2a; color: #3a6a2a;
    }
    .metro-arrow-btn.step5 i   { font-size: .85rem; }
    .metro-arrow-btn.step5 span { font-size: .65rem; letter-spacing: .04em; }

    /* ── Dial ────────────────────────────── */
    .metro-dial-outer {
      width: 190px; height: 190px; border-radius: 50%;
      /* Esfera crema/gris clara igual a la imagen de referencia */
      background: radial-gradient(circle at 36% 32%,
        #ffffff 0%, #eeeee4 40%, #d8d8cc 100%);
      box-shadow:
        0 0 0 1px #c8c8b8,
        0 0 0 10px #edeee4,
        0 0 0 12px #d4d4c4,
        0 6px 28px rgba(60,90,40,.13);
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: grab; user-select: none;
    }
    .metro-dial-outer:active { cursor: grabbing; }

    /* Borde punteado */
    .metro-dial-dots {
      position: absolute; inset: 10px; border-radius: 50%;
      border: 2px dotted rgba(60,100,40,.18);
      pointer-events: none;
    }

    /* Indicador de ángulo verde oscuro */
    .metro-dial-indicator {
      position: absolute; width: 3px; height: 22px;
      background: #3a6a2a; border-radius: 2px;
      top: 14px; left: calc(50% - 1.5px);
      transform-origin: 1.5px 81px;
      box-shadow: 0 0 5px rgba(60,100,40,.35);
      pointer-events: none;
    }

    /* Disco interior gris claro */
    .metro-dial-inner {
      width: 92px; height: 92px; border-radius: 50%;
      background: radial-gradient(circle at 36% 32%,
        #f8f8f0 0%, #deddd4 60%, #c4c4b8 100%);
      box-shadow:
        inset 0 2px 6px rgba(255,255,255,.9),
        inset 0 -2px 6px rgba(0,0,0,.08),
        0 2px 8px rgba(0,0,0,.1);
      display: flex; align-items: center; justify-content: center; z-index: 2;
    }

    /* ── Botón Play / Stop ────────────────
       VERDE SIEMPRE. Solo cambia el ícono:
       ▶ triángulo  →  ■ cuadrado
    ────────────────────────────────────── */
    .metro-play-center {
      width: 54px; height: 54px; border-radius: 50%;
      background: #3a6a2a;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(45,90,45,.35),
                  inset 0 1px 3px rgba(255,255,255,.2);
      transition: background .15s;
    }
    .metro-play-center:hover { background: #4a7a3a; }
    /* is-playing: MISMO verde, ícono ya cambia a cuadrado vía JS */
    .metro-play-center.is-playing { background: #3a6a2a; }
    .metro-play-center.is-playing:hover { background: #4a7a3a; }
    .metro-play-center svg { fill: #ffffff; width: 18px; height: 18px; }

    /* ── Compás + TAP ───────────────────── */
    .metro-bottom-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .metro-ts-select { display: flex; gap: 8px; flex-wrap: wrap; }
    .metro-ts-btn {
      padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid #ccccc0; background: #fff;
      color: #4a7a3a; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: background .15s, color .15s, border-color .15s;
      font-family: 'Montserrat', sans-serif;
      box-shadow: 0 1px 4px rgba(60,90,40,.07);
    }
    .metro-ts-btn.active {
      background: #3a6a2a; color: #fff; border-color: #3a6a2a;
      box-shadow: 0 2px 8px rgba(45,90,45,.22);
    }
    .metro-tap-big {
      flex: 1; min-width: 80px; padding: 11px 16px; border-radius: 10px;
      border: 1.5px solid #ccccc0; background: #fff;
      color: #4a7a3a; font-size: .88rem; font-weight: 700;
      letter-spacing: .08em; cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, color .15s, border-color .15s;
      box-shadow: 0 1px 4px rgba(60,90,40,.07);
    }
    .metro-tap-big:hover { background: #eaf0e4; border-color: #3a6a2a; color: #1a3a1a; }
    .metro-tap-big:active { transform: scale(.97); }

    /* ── Consejo ─────────────────────────── */
    .metro-tip {
      background: #eaf0e4; border: 1px solid #c4d4b4;
      border-radius: 10px; padding: 10px 16px;
      font-size: .75rem; color: #3a6a2a;
      display: flex; align-items: center; gap: 8px;
    }
    .metro-tip i { flex-shrink: 0; color: #3a6a2a; }
  </style>
</head>
<body>
  <main class="metro-page">

    <a href="index.html" class="metro-back-link">
      <i class="fa-solid fa-arrow-left"></i> Volver al inicio
    </a>

    <div class="metro-page-header">
      <h2 class="metro-main-title">Centro de Artes Musicales · Herramientas</h2>
      <p class="metro-sub-title">Metrónomo</p>
    </div>

    <div class="metro-body">

      <!-- Display -->
      <div class="metro-display">
        <div class="metro-display-cols">

          <div class="metro-col">
            <span class="metro-col-label">Tempo</span>
            <span class="metro-col-value" id="mBpmNum">100</span>
            <span class="metro-col-sub" id="mTempoName">Andante</span>
          </div>

          <div class="metro-col-divider"></div>

          <div class="metro-col">
            <span class="metro-col-label">Compás</span>
            <span class="metro-col-value" id="mTsDisplay" style="font-size:2rem;">4/4</span>
            <span class="metro-col-sub" id="mTsName">Compás simple</span>
          </div>

          <div class="metro-col-divider"></div>

          <div class="metro-col">
            <span class="metro-col-label">Subdivisión</span>
            <button class="metro-subdiv-btn" id="mSubdivBtn" title="Configurar acentos">♩</button>
            <span class="metro-col-sub">Negra</span>
          </div>

          <div class="metro-col-divider"></div>

          <div class="metro-col">
            <span class="metro-col-label">T.S.</span>
            <div class="metro-sound-toggle">
              <button class="toggle-switch on" id="mSoundToggle"></button>
              <span class="toggle-label" id="mSoundLabel">Sonido activado</span>
            </div>
          </div>

        </div>
        <div class="metro-beats-display" id="mBeatBars"></div>
      </div>

      <!-- Panel de acentos -->
      <div class="metro-accents-panel" id="mAccentsPanel">
        <p>Toca cada pulso para cambiar su acento</p>
      </div>

      <!-- Slider -->
      <div class="metro-bpm-slider-row">
        <span>30</span>
        <input type="range" class="metro-bpm-slider" id="mSlider" min="30" max="240" value="100" step="1"/>
        <span>240</span>
      </div>

      <!-- Dial + flechas -->
      <div class="metro-dial-wrap">

        <button class="metro-arrow-btn step5" id="mMinus5" title="-5 BPM">
          <i class="fa-solid fa-angles-left"></i>
          <span>-5</span>
        </button>
        <button class="metro-arrow-btn step1" id="mMinus1" title="-1 BPM">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="metro-dial-outer" id="mDial">
          <div class="metro-dial-dots"></div>
          <div class="metro-dial-indicator" id="mDialIndicator"></div>
          <div class="metro-dial-inner">
            <button class="metro-play-center" id="mPlayBtn" title="Iniciar">
              <!-- Ícono PLAY (triángulo) -->
              <svg viewBox="0 0 16 16" id="mIconPlay" style="display:block;">
                <polygon points="3,1 14,8 3,15" fill="white"/>
              </svg>
              <!-- Ícono STOP (cuadrado) — oculto por defecto -->
              <svg viewBox="0 0 16 16" id="mIconStop" style="display:none;">
                <rect x="2" y="2" width="12" height="12" rx="1" fill="white"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="metro-arrow-btn step1" id="mPlus1" title="+1 BPM">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button class="metro-arrow-btn step5" id="mPlus5" title="+5 BPM">
          <i class="fa-solid fa-angles-right"></i>
          <span>+5</span>
        </button>

      </div>

      <!-- Compás + TAP -->
      <div class="metro-bottom-row">
        <div class="metro-ts-select" id="mTsSelector">
          <button class="metro-ts-btn" data-beats="2" data-label="2/4" data-name="Compás simple">2/4</button>
          <button class="metro-ts-btn" data-beats="3" data-label="3/4" data-name="Vals">3/4</button>
          <button class="metro-ts-btn active" data-beats="4" data-label="4/4" data-name="Compás simple">4/4</button>
          <button class="metro-ts-btn" data-beats="6" data-label="6/8" data-name="Compás compuesto">6/8</button>
          <button class="metro-ts-btn" data-beats="9" data-label="9/8" data-name="Compás compuesto">9/8</button>
          <button class="metro-ts-btn" data-beats="12" data-label="12/8" data-name="Compás compuesto">12/8</button>
        </div>
        <button class="metro-tap-big" id="mTapBtn">
          <i class="fa-solid fa-hand-pointer"></i> TAP
        </button>
      </div>

      <!-- Consejo -->
      <div class="metro-tip">
        <i class="fa-solid fa-leaf"></i>
        <span><strong>Consejo:</strong> Usa el metrónomo para mejorar tu precisión y mantener un tiempo constante.</span>
      </div>

    </div>
  </main>

  <script>
  (function(){
    /* ── Estado ─────────────────────────── */
    let bpm=100, beats=4, curBeat=0;
    let playing=false, soundOn=true, timerId=null, audioCtx=null;
    let accentLevels=[];
    let lastAngle=null, bpmAtDrag=0, accum=0;

    /* ── DOM ──────────────────────────────── */
    const bpmNum      = document.getElementById('mBpmNum');
    const tempoNameEl = document.getElementById('mTempoName');
    const tsDisplay   = document.getElementById('mTsDisplay');
    const tsNameEl    = document.getElementById('mTsName');
    const beatBarsW   = document.getElementById('mBeatBars');
    const slider      = document.getElementById('mSlider');
    const playBtn     = document.getElementById('mPlayBtn');
    const iconPlay    = document.getElementById('mIconPlay');
    const iconStop    = document.getElementById('mIconStop');
    const tapBtn      = document.getElementById('mTapBtn');
    const dialEl      = document.getElementById('mDial');
    const indicator   = document.getElementById('mDialIndicator');
    const tsBtns      = document.querySelectorAll('.metro-ts-btn');
    const subdivBtn   = document.getElementById('mSubdivBtn');
    const accentsPanel= document.getElementById('mAccentsPanel');
    const soundToggle = document.getElementById('mSoundToggle');
    const soundLabel  = document.getElementById('mSoundLabel');

    /* ── Tablas ───────────────────────────── */
    const tempos=[
      [30,59,'Larghissimo'],[60,65,'Largo'],[66,75,'Adagio'],
      [76,107,'Andante'],[108,119,'Moderato'],[120,155,'Allegro'],
      [156,175,'Vivace'],[176,200,'Presto'],[201,240,'Prestissimo']
    ];
    function getTempoName(b){return(tempos.find(([lo,hi])=>b>=lo&&b<=hi)||[,,'?'])[2];}

    /* ── Audio ────────────────────────────── */
    function getCtx(){
      if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      return audioCtx;
    }
    function playClick(level){
      if(!soundOn||level===0) return;
      const ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=level===2?1400:900;
      g.gain.setValueAtTime(level===2?.62:.38,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+.07);
      o.start(ctx.currentTime); o.stop(ctx.currentTime+.09);
    }

    /* ── Acentos ──────────────────────────── */
    function initAccents(){
      accentLevels=[];
      for(let i=0;i<beats;i++) accentLevels.push(i===0?2:1);
    }

    /* ── Barras ───────────────────────────── */
    function buildBars(){
      beatBarsW.innerHTML='';
      for(let i=0;i<beats;i++){
        const b=document.createElement('div');
        b.className='metro-beat-bar';
        beatBarsW.appendChild(b);
      }
    }
    function updateBars(beat){
      beatBarsW.querySelectorAll('.metro-beat-bar').forEach((b,i)=>{
        b.classList.remove('active-strong','active-normal','active-soft');
        if(i===beat){
          const lv=accentLevels[i];
          if(lv===2) b.classList.add('active-strong');
          else if(lv===1) b.classList.add('active-normal');
          else b.classList.add('active-soft');
        }
      });
    }

    /* ── Panel de acentos ─────────────────── */
    function buildAccentsPanel(){
      const title=accentsPanel.querySelector('p');
      accentsPanel.innerHTML=''; accentsPanel.appendChild(title);
      for(let i=0;i<beats;i++){
        const btn=document.createElement('button');
        btn.className='accent-beat-btn';
        btn.dataset.index=i; btn.dataset.level=accentLevels[i];
        const numS=document.createElement('span'); numS.className='beat-num'; numS.textContent=`T${i+1}`;
        const icnS=document.createElement('span'); icnS.className='beat-icon';
        icnS.textContent=accentLevels[i]===2?'▲':accentLevels[i]===1?'●':'○';
        btn.appendChild(numS); btn.appendChild(icnS);
        btn.addEventListener('click',()=>{
          accentLevels[i]=accentLevels[i]===2?1:accentLevels[i]===1?0:2;
          btn.dataset.level=accentLevels[i];
          icnS.textContent=accentLevels[i]===2?'▲':accentLevels[i]===1?'●':'○';
        });
        accentsPanel.appendChild(btn);
      }
    }
    subdivBtn.addEventListener('click',()=>{
      const v=accentsPanel.classList.toggle('visible');
      if(v) buildAccentsPanel();
    });

    /* ── Toggle sonido ────────────────────── */
    soundToggle.addEventListener('click',()=>{
      soundOn=!soundOn;
      soundToggle.classList.toggle('on',soundOn);
      soundToggle.classList.toggle('off',!soundOn);
      soundLabel.textContent=soundOn?'Sonido activado':'Sonido silenciado';
    });

    /* ── Dial: giro angular ───────────────── */
    function getAngle(e,rect){
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
      const px=e.clientX!==undefined?e.clientX:e.touches[0].clientX;
      const py=e.clientY!==undefined?e.clientY:e.touches[0].clientY;
      return Math.atan2(py-cy,px-cx)*(180/Math.PI);
    }
    function onDragStart(e){
      const rect=dialEl.getBoundingClientRect();
      lastAngle=getAngle(e,rect); bpmAtDrag=bpm; accum=0; e.preventDefault();
    }
    function onDragMove(e){
      if(lastAngle===null) return;
      const rect=dialEl.getBoundingClientRect();
      const angle=getAngle(e,rect);
      let delta=angle-lastAngle;
      if(delta>180) delta-=360;
      if(delta<-180) delta+=360;
      accum+=delta; lastAngle=angle;
      setBpm(bpmAtDrag+Math.round(accum/4));
    }
    function onDragEnd(){ lastAngle=null; }

    dialEl.addEventListener('mousedown',onDragStart);
    window.addEventListener('mousemove',onDragMove);
    window.addEventListener('mouseup',onDragEnd);
    dialEl.addEventListener('touchstart',onDragStart,{passive:false});
    window.addEventListener('touchmove',onDragMove,{passive:false});
    window.addEventListener('touchend',onDragEnd);

    /* ── Display visual ───────────────────── */
    function updateDial(){
      const pct=(bpm-30)/(240-30);
      indicator.style.transform=`rotate(${pct*300}deg)`;
    }
    function updateSlider(){
      slider.style.setProperty('--fill',((bpm-30)/(240-30)*100)+'%');
      slider.value=bpm;
    }
    function updateDisplay(){
      bpmNum.textContent=bpm;
      tempoNameEl.textContent=getTempoName(bpm);
      updateSlider(); updateDial();
    }

    /* ── Tick ─────────────────────────────── */
    function tick(){
      playClick(accentLevels[curBeat]);
      updateBars(curBeat);
      curBeat=(curBeat+1)%beats;
    }

    /* ── Play / Stop ──────────────────────── */
    function start(){
      playing=true; curBeat=0; buildBars(); tick();
      timerId=setInterval(tick,(60/bpm)*1000);
      /* Mostrar cuadrado ■, ocultar triángulo ▶ */
      iconPlay.style.display='none';
      iconStop.style.display='block';
      playBtn.classList.add('is-playing');
      playBtn.title='Detener';
    }
    function stop(){
      playing=false; clearInterval(timerId);
      beatBarsW.querySelectorAll('.metro-beat-bar')
        .forEach(b=>b.classList.remove('active-strong','active-normal','active-soft'));
      /* Mostrar triángulo ▶, ocultar cuadrado ■ */
      iconPlay.style.display='block';
      iconStop.style.display='none';
      playBtn.classList.remove('is-playing');
      playBtn.title='Iniciar';
    }
    function setBpm(val){
      bpm=Math.min(240,Math.max(30,Math.round(val)));
      updateDisplay();
      if(playing){stop();start();}
    }

    /* ── Eventos ──────────────────────────── */
    playBtn.addEventListener('click',()=>playing?stop():start());
    document.getElementById('mMinus5').addEventListener('click',()=>setBpm(bpm-5));
    document.getElementById('mPlus5').addEventListener('click',()=>setBpm(bpm+5));
    document.getElementById('mMinus1').addEventListener('click',()=>setBpm(bpm-1));
    document.getElementById('mPlus1').addEventListener('click',()=>setBpm(bpm+1));
    slider.addEventListener('input',()=>setBpm(parseInt(slider.value,10)));

    tsBtns.forEach(btn=>{
      btn.addEventListener('click',()=>{
        tsBtns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        beats=parseInt(btn.dataset.beats,10);
        tsDisplay.textContent=btn.dataset.label;
        tsNameEl.textContent=btn.dataset.name||'';
        initAccents(); buildBars();
        if(accentsPanel.classList.contains('visible')) buildAccentsPanel();
        if(playing){stop();start();}
      });
    });

    let tapTimes=[];
    tapBtn.addEventListener('click',()=>{
      const now=Date.now(); tapTimes.push(now);
      if(tapTimes.length>1){
        const r=tapTimes.slice(-6);
        const avg=r.slice(1).map((t,i)=>t-r[i]).reduce((a,b)=>a+b,0)/(r.length-1);
        setBpm(Math.round(60000/avg));
      }
      if(tapTimes.length>8) tapTimes=tapTimes.slice(-6);
    });

    /* ── Init ─────────────────────────────── */
    initAccents(); buildBars(); updateDisplay();
  })();
  </script>
</body>
</html>
